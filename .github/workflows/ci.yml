name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t backend:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 4000:4000 \
            -e JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            -e PUBLIC_BASE_URL=http://localhost:4000 backend:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:4000/readyz && exit 0
            sleep 1
          done
          docker logs api
          exit 1
