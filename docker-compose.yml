services:
  api:
    build: .
    ports:
      - '4000:4000'
    environment:
      PUBLIC_BASE_URL: http://localhost:4000
      # Override in a .env file next to this compose file for anything beyond local testing.
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      CORS_ORIGIN: '*'
      LOG_LEVEL: info
    volumes:
      - api-data:/data
    restart: unless-stopped

volumes:
  api-data:
