# Fly.io config. Deploy with: fly launch --copy-config --no-deploy && fly volumes create data --size 1 && fly deploy
app = 'backend-url-shortener'
primary_region = 'bom'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '4000'
  DATABASE_PATH = '/data/app.db'
  TRUST_PROXY = '1'
  # PUBLIC_BASE_URL is set to https://<app>.fly.dev by default; change it if you add a custom domain.
  PUBLIC_BASE_URL = 'https://backend-url-shortener.fly.dev'

[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/readyz'
    timeout = '3s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
